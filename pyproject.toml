[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lag"
version = "0.1.0"
description = "LAG (Lie Algebra Geometry): Lie-group exponentials, Jacobian log-determinants, equivariant heads and flows in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["lag*"]

[tool.setuptools.package-data]
lag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
